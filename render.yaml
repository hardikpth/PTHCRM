# Render.com blueprint for the PTH CRM backend (Django + DRF + JWT + PostgreSQL).
# In Render: New → Blueprint → point at this repo. It creates the DB + web service.
databases:
  - name: pthcrm-db
    plan: free
    databaseName: pthcrm
    user: pthcrm

services:
  - type: web
    name: pthcrm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi --workers 3 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: pthcrm-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Set this to your deployed front-end origin(s), comma-separated:
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hardikpth.github.io"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
